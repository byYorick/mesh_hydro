# ========================================
# Docker Compose для РАЗРАБОТКИ
# Использует volumes для hot reload
# ========================================
# 
# 📡 Подключение ESP32 к MQTT:
#   - ESP32 использует: mqtt://192.168.1.100:1883 (ЖЕСТКО ПРОПИСАНО в common/mesh_config/mesh_config.h)
#   - Внутри Docker: сервисы используют имена (mosquitto, backend, postgres)
#   - Порт 1883 проброшен на хост для доступа ESP32
# ========================================

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: hydro_mosquitto_dev
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - hydro_network
    healthcheck:
      test: ["CMD-SHELL", "pgrep mosquitto || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: hydro_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: hydro_dev
      POSTGRES_USER: hydro
      POSTGRES_PASSWORD: hydro_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - hydro_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydro -d hydro_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: hydro_backend_dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - CACHE_DRIVER=array
      - CONFIG_CACHE_ENABLED=false
      - ROUTE_CACHE_ENABLED=false
      - VIEW_CACHE_ENABLED=false
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=hydro_dev
      - DB_USERNAME=hydro
      - DB_PASSWORD=hydro_dev_pass
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - BROADCAST_DRIVER=reverb
      - REVERB_APP_ID=hydro-app
      - REVERB_APP_KEY=hydro-app-key
      - REVERB_APP_SECRET=hydro-app-secret
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
    volumes:
      - ./backend:/var/www/html:delegated  # Hot reload!
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      reverb:
        condition: service_started
    networks:
      - hydro_network
    command: >
      sh -c "composer install --no-interaction &&
             php artisan key:generate --force || true &&
             php artisan config:clear &&
             php artisan route:clear &&
             php artisan cache:clear &&
             php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  mqtt_listener:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: hydro_mqtt_dev
    restart: unless-stopped
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - CACHE_DRIVER=array
      - CONFIG_CACHE_ENABLED=false
      - ROUTE_CACHE_ENABLED=false
      - VIEW_CACHE_ENABLED=false
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=hydro_dev
      - DB_USERNAME=hydro
      - DB_PASSWORD=hydro_dev_pass
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - BROADCAST_DRIVER=reverb
      - REVERB_APP_ID=hydro-app
      - REVERB_APP_KEY=hydro-app-key
      - REVERB_APP_SECRET=hydro-app-secret
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
    volumes:
      - ./backend:/var/www/html:delegated  # Hot reload!
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      reverb:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - hydro_network
    command: >
      sh -c "composer install --no-interaction &&
             php artisan mqtt:listen"

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: hydro_reverb_dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - CACHE_DRIVER=array
      - CONFIG_CACHE_ENABLED=false
      - ROUTE_CACHE_ENABLED=false
      - VIEW_CACHE_ENABLED=false
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=hydro_dev
      - DB_USERNAME=hydro
      - DB_PASSWORD=hydro_dev_pass
      - BROADCAST_DRIVER=reverb
      - REVERB_APP_ID=hydro-app
      - REVERB_APP_KEY=hydro-app-key
      - REVERB_APP_SECRET=hydro-app-secret
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
    volumes:
      - ./backend:/var/www/html:delegated  # Hot reload!
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hydro_network
    command: >
      sh -c "composer install --no-interaction &&
             php artisan reverb:start --host=0.0.0.0 --port=8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: hydro_frontend_dev
    restart: unless-stopped
    ports:
      - "5173:5173"  # Vite dev server (localhost:5173)
    volumes:
      - ./frontend:/app:delegated  # Оптимизация производительности
      - /app/node_modules  # Исключить node_modules из volume
    depends_on:
      - backend
      - reverb
    networks:
      - hydro_network
    command: npm run dev -- --host 0.0.0.0 --port 5173

networks:
  hydro_network:
    driver: bridge

volumes:
  postgres_dev_data:
    driver: local

